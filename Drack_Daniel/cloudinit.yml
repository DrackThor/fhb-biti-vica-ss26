#cloud-config
package_update: true
package_upgrade: true
packages:
  - python3
  - python3-pip
  - git
runcmd:
  - [ bash, -lc, "pip3 install flask psutil" ]
  - [ bash, -lc, "cat > /opt/vm-info/app.py <<'PY'\nfrom flask import Flask, jsonify\nimport platform, socket, psutil, subprocess\napp = Flask(__name__)\n\ndef get_filesystems():\n    fs = []\n    for part in psutil.disk_partitions(all=False):\n        try:\n            usage = psutil.disk_usage(part.mountpoint)\n            fs.append({\n                'device': part.device,\n                'mountpoint': part.mountpoint,\n                'fstype': part.fstype,\n                'total_bytes': usage.total,\n                'used_bytes': usage.used,\n                'free_bytes': usage.free\n            })\n        except Exception:\n            pass\n    return fs\n\n@app.route('/')\ndef index():\n    info = {\n        'hostname': platform.node(),\n        'kernel': platform.release(),\n        'platform': platform.platform(),\n        'ip_addresses': [s for s in socket.gethostbyname_ex(socket.gethostname())[2]],\n        'memory_total_bytes': psutil.virtual_memory().total,\n        'memory_available_bytes': psutil.virtual_memory().available,\n        'cpu_count': psutil.cpu_count(logical=True),\n        'filesystems': get_filesystems()\n    }\n    return jsonify(info)\n\nif __name__ == \"__main__\":\n    app.run(host='0.0.0.0', port=80)\nPY" ]
  - [ bash, -lc, "cat > /etc/systemd/system/vm-info.service <<'UNIT'\n[Unit]\nDescription=VM Info HTTP Service\nAfter=network.target\n\n[Service]\nType=simple\nExecStart=/usr/bin/python3 /opt/vm-info/app.py\nRestart=on-failure\n\n[Install]\nWantedBy=multi-user.target\nUNIT" ]
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, vm-info.service ]
  - [ systemctl, start, vm-info.service ]
final_message: "Cloud-init finished. VM Info service listening on port 80"
