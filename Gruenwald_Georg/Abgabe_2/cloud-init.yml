#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2

write_files:
  # Docker Compose for Netdata, Swagger UI, AND Caddy
  - path: /opt/monitoring/docker-compose.yml
    content: |
      services:
        # Netdata Monitoring Platform
        netdata:
          image: netdata/netdata:stable
          container_name: netdata
          pid: host
          network_mode: host
          restart: always
          cap_add: [SYS_PTRACE, SYS_ADMIN]
          security_opt: [apparmor:unconfined]
          volumes:
            - netdataconfig:/etc/netdata
            - netdatalib:/var/lib/netdata
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro

        # Swagger UI REST API Documentation Tool 
        swagger-ui:
          image: swaggerapi/swagger-ui
          container_name: swagger-ui
          restart: always
          ports: ["8080:8080"]
          environment:
            - API_URL=https://${stats_domain}.${second_level_domain}./netdata-swagger.json

        # Caddy Reverse Proxy
        caddy:
          image: caddy:2
          container_name: caddy
          restart: always
          network_mode: host
          volumes:
            # Mount the config file we create below into the container
            - /etc/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            # Persist Let's Encrypt SSL certificates so we don't hit rate limits on destroy/deploy
            - caddy_data:/data
            - caddy_config:/config

      volumes:
        netdataconfig:
        netdatalib:
        caddy_data:
        caddy_config:

  # Caddy Reverse Proxy Configuration (Routing logic stays identical)
  - path: /etc/caddy/Caddyfile
    content: |
      {
          email ${second_level_domain}@${root_domain}second_level_domain
      }

      ${stats_domain} {
          # Allow the API Docs domain to fetch the Swagger JSON
          header {
              Access-Control-Allow-Origin "https://${api_domain}.${second_level_domain}"
              Access-Control-Allow-Methods "GET, OPTIONS"
          }
          reverse_proxy localhost:19999
      }

      ${api_domain} {
          reverse_proxy localhost:8080
      }

runcmd:
  # Start the entire stack with one command!
  - systemctl enable --now docker
  - cd /opt/monitoring && docker compose up -d
