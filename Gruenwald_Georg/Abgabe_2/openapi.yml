openapi: 3.0.3
info:
  title: Exoscale VM Monitoring API
  description: |
    ### Hochschule Burgenland Virtualization & Cloud Technologies SS26 Assignment 2
    This API provides real-time technical telemetry for the deployed Exoscale Virtual Machine. 
    It acts as a lightweight wrapper around the native Netdata backend, exposing only the critical 
    endpoints required for infrastructure validation.
  version: 1.0.0
  contact:
    name: Georg Grünwald

# Using a relative URL ensures Swagger UI automatically prepends your current domain (e.g., https://api...)
servers:
  - url: /
    description: Live Exoscale VM Metrics

paths:
  /api/v1/info:
    get:
      summary: Get Host System Details
      description: Returns static information about the VM, including the Kernel, Operating System, Architecture, and Hypervisor type.
      tags:
        - System Architecture
      responses:
        '200':
          description: Successful retrieval of system information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "netdata v1.40.0"
                  os_name:
                    type: string
                    example: "Ubuntu"
                  os_version:
                    type: string
                    example: "26.04 LTS"
                  kernel_name:
                    type: string
                    example: "Linux"
                  kernel_version:
                    type: string
                    example: "6.8.0-xx-generic"
                  architecture:
                    type: string
                    example: "x86_64"
                  virtualization:
                    type: string
                    example: "kvm"

  /api/v1/data:
    get:
      summary: Get Live Hardware Metrics
      description: Retrieves real-time data for specific hardware components (CPU, RAM, Disk). Use the dropdown to select the specific chart.
      tags:
        - Live Telemetry
      parameters:
        - in: query
          name: chart
          required: true
          description: The specific Netdata chart to query.
          schema:
            type: string
            enum:
              - system.cpu       # Total CPU utilization
              - system.ram       # Memory usage
              - disk.space       # Storage filesystem usage
              - system.ipv4      # Network traffic
            default: system.ram
        - in: query
          name: points
          required: false
          description: Number of data points to return (defaults to 1 for the most recent reading).
          schema:
            type: integer
            default: 1
        - in: query
          name: format
          required: false
          description: The response format.
          schema:
            type: string
            default: json
      responses:
        '200':
          description: Successful retrieval of metric data.
