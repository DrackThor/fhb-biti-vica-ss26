openapi: 3.0.3
info:
  title: Exoscale VM Monitoring API
  description: |
    ### Hochschule Burgenland Virtualization & Cloud Technologies SS26 Assignment 2
    This API provides real-time technical telemetry for the deployed Exoscale Virtual Machine. 
    It acts as a lightweight wrapper around the native Netdata backend, exposing only the critical 
    endpoints required for infrastructure validation.
  version: 1.0.0
  contact:
    name: Georg Grünwald

# Using a dynamic URL injected by Terraform to point to the Netdata backend
servers:
  - url: https://${stats_domain}
    description: Live Exoscale VM Metrics

paths:
  /api/v1/info:
    get:
      summary: Get Host System Details
      description: Returns static hardware and operating system information about the underlying virtual machine.
      tags:
        - System Architecture
      responses:
        '200':
          description: Successful retrieval of system information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  os_version:
                    type: string
                    example: "Ubuntu, 26.04 (Resolute Raccoon)"
                  architecture:
                    type: string
                    example: "x86_64"
                  kernel:
                    type: string
                    example: "Linux, 7.0.0-14-generic"
                  cpu:
                    type: string
                    example: "2.40 GHz (2 Cores)"
                  memory:
                    type: string
                    example: "1.91 GiB RAM"
                  hard_disk_size:
                    type: string
                    example: "50.00 GiB"
                  timezone:
                    type: string
                    example: "Etc/UTC"

  /api/v1/data:
    get:
      summary: Get Live Hardware Metrics
      description: Retrieves real-time data powering the main dashboard gauges (CPU, RAM, Disk I/O, Network, and Load). Select a chart from the dropdown to query the live data feed.
      tags:
        - Live Telemetry
      parameters:
        - in: query
          name: chart
          required: true
          description: The specific Netdata chart to query.
          schema:
            type: string
            enum:
              - system.cpu       # Powers "Avg CPU per Node"
              - system.ram       # Powers "Avg Used RAM per Node"
              - system.io        # Powers "Total Disk Reads/Writes"
              - system.net       # Powers "Total Network Inbound/Outbound"
              - system.load      # Powers "Avg System Load (1 min)"
              - disk.space       # Powers Disk Usage capacity metrics
            default: system.cpu
        - in: query
          name: points
          required: false
          description: Number of data points to return (defaults to 1 for the most recent reading).
          schema:
            type: integer
            default: 1
        - in: query
          name: format
          required: false
          description: The response format.
          schema:
            type: string
            default: json
      responses:
        '200':
          description: Successful retrieval of metric data.

  /api/v1/containers:
    get:
      summary: Get Docker Container Metrics
      description: Retrieves real-time cgroup telemetry (CPU, RAM, Disk I/O) specifically for the individual Docker containers running on the host machine.
      tags:
        - Container Telemetry
      parameters:
        - in: query
          name: container
          required: true
          description: The specific Docker container to monitor.
          schema:
            type: string
            enum:
              - netdata
              - caddy
              - swagger-ui
            default: netdata
        - in: query
          name: chart
          required: true
          description: The specific metric to query for the selected container.
          schema:
            type: string
            enum:
              - cpu        # Container CPU utilization
              - ram        # Container Memory usage
              - disk       # Container Disk I/O
            default: cpu
      responses:
        '200':
          description: Successful retrieval of container metric data.
