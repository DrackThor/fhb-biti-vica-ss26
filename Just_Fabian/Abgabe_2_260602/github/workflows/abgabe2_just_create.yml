name: Abgabe2 Just - Infrastruktur erstellen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      # Secrets aus Github
      TF_VAR_exoscale_api_key:    ${{ secrets.EXOSCALE_API_KEY }}
      TF_VAR_exoscale_api_secret: ${{ secrets.EXOSCALE_API_SECRET }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Terraform installieren
        uses: hashicorp/setup-terraform@v3

      - name: Terraform initialisieren
        run: terraform init

      - name: Plan anzeigen
        run: terraform plan

      # Erstellt die Infrastruktur ohne Rückfrage
      - name: Infrastruktur erstellen
        run: terraform apply -auto-approve

      # State zurück ins Repo committen, damit Destroy ihn findet
      - name: State speichern
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add -f terraform.tfstate
          git commit -m "Update Terraform state (create)" || echo "Keine Aenderung"
          git push