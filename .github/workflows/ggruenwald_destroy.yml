name: "Destroy Infrastructure"
on:
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      # Securely pulled from the Secrets Vault
      TF_VAR_exoscale_api_key: ${{ secrets.EXOSCALE_API_KEY }}
      TF_VAR_exoscale_api_secret: ${{ secrets.EXOSCALE_API_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1

      # Retrieve the state file from the last Deploy run
      - name: Download Terraform State
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: deploy.yml # Tell it exactly which workflow created the artifact
          name: tofu-state
          path: ./Gruenwald_Georg/Abgabe_2/ # Must end with a slash!
          search_artifacts: true
      
      # Navigate directly into the assignment folder to execute the code
      - name: Initialize & Destroy
        working-directory: ./Gruenwald_Georg/Abgabe_2
        run: |
          tofu init
          tofu destroy -auto-approve
