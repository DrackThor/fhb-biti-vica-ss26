name: "Deploy Infrastruktur"

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Prieller_Christian/Abgabe_2/terraform

    steps:
      - uses: actions/checkout@v4

      - name: OpenTofu installieren
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.0"

      - name: State laden
        uses: actions/download-artifact@v4
        with:
          name: terraform-state
          path: ./Prieller_Christian/Abgabe_2/terraform
        continue-on-error: true

      - name: Terraform Init
        run: tofu init

      - name: Terraform Plan
        run: tofu plan -no-color
        env:
          TF_VAR_exoscale_api_key: ${{ secrets.EXOSCALE_API_KEY }}
          TF_VAR_exoscale_api_secret: ${{ secrets.EXOSCALE_API_SECRET }}

      - name: Terraform Apply
        run: tofu apply -auto-approve -no-color
        env:
          TF_VAR_exoscale_api_key: ${{ secrets.EXOSCALE_API_KEY }}
          TF_VAR_exoscale_api_secret: ${{ secrets.EXOSCALE_API_SECRET }}

      - name: Outputs anzeigen
        run: tofu output -no-color

      - name: State sichern
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-state
          path: |
            ./Prieller_Christian/Abgabe_2/terraform/terraform.tfstate
            ./Prieller_Christian/Abgabe_2/terraform/terraform.tfstate.backup
          retention-days: 90
          overwrite: true
